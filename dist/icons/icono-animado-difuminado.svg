<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Carita animada que parpadea y mira a los lados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .lean    { animation: lean 9s ease-in-out infinite; }
    .breathe { animation: breathe 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
    .look    { animation: look 9s ease-in-out infinite; }
    .eye     { animation: blink 9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 50%; }
    @keyframes lean {
      0%,12%  { transform: translateX(0); }
      16%,30% { transform: translateX(-5px); }
      35%,40% { transform: translateX(0); }
      44%,58% { transform: translateX(5px); }
      63%,100%{ transform: translateX(0); }
    }
    @keyframes look {
      0%,12%  { transform: translate(0,0); }
      16%,30% { transform: translate(-14px,-1px); }
      35%,40% { transform: translate(0,0); }
      44%,58% { transform: translate(14px,-1px); }
      63%,100%{ transform: translate(0,0); }
    }
    @keyframes blink {
      0%,66%  { transform: scaleY(1); }
      68%     { transform: scaleY(0.08); }
      71%,77% { transform: scaleY(1); }
      79%     { transform: scaleY(0.08); }
      82%,100%{ transform: scaleY(1); }
    }
    @keyframes breathe {
      0%,100% { transform: scale(1,1); }
      50%     { transform: scale(1.015,0.985); }
    }
    @media (prefers-reduced-motion: reduce) {
      .lean,.breathe,.look,.eye { animation: none; }
    }
  </style>
  <defs>
    <path id="P" d="M95 340C95 245 170 178 256 178s161 67 161 162q0 55-55 55H150q-55 0-55-55Z"/>
    <clipPath id="clipBody"><use href="#P" xlink:href="#P"/></clipPath>

    <radialGradient id="bg" cx="50%" cy="46%" r="75%">
      <stop offset="0" stop-color="#F1E8D7"/>
      <stop offset="1" stop-color="#EDE2D0"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4A590"/>
      <stop offset=".3" stop-color="#EE6247"/>
      <stop offset=".55" stop-color="#EA5538"/>
      <stop offset=".85" stop-color="#E3614A"/>
      <stop offset="1" stop-color="#E9856C"/>
    </linearGradient>
    <linearGradient id="halo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBE59A"/>
      <stop offset="1" stop-color="#F6CF70"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".92"/>
      <stop offset=".45" stop-color="#FFE3DA" stop-opacity=".38"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glossL" cx="40%" cy="40%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#FFE6DE" stop-opacity=".4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="eyeFill" cx="38%" cy="32%" r="80%">
      <stop offset="0" stop-color="#FFF9F6"/>
      <stop offset=".6" stop-color="#F6DAD6"/>
      <stop offset="1" stop-color="#E3BFC6"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#BFDDF5" stop-opacity="0"/>
      <stop offset=".5" stop-color="#A9CBEE" stop-opacity=".35"/>
      <stop offset="1" stop-color="#8FB9E8"/>
    </linearGradient>

    <filter id="bWide" filterUnits="userSpaceOnUse" x="-60" y="-60" width="632" height="632"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="bMid"  filterUnits="userSpaceOnUse" x="-60" y="-60" width="632" height="632"><feGaussianBlur stdDeviation="11"/></filter>
    <filter id="bHalo" filterUnits="userSpaceOnUse" x="-60" y="-60" width="632" height="632"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="bEdge" filterUnits="userSpaceOnUse" x="-60" y="-60" width="632" height="632"><feGaussianBlur stdDeviation="1.4"/></filter>
    <filter id="bRim"  filterUnits="userSpaceOnUse" x="-60" y="-60" width="632" height="632"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="bGloss" filterUnits="userSpaceOnUse" x="-60" y="-60" width="632" height="632"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="bEye"  x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation=".7"/></filter>
    <filter id="grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="7"/>
      <feColorMatrix values="0 0 0 0 .45  0 0 0 0 .3  0 0 0 0 .25  0 0 0 .22 0"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- difuminados exteriores (fijos) -->
  <use href="#P" xlink:href="#P" fill="#EE4F34" stroke="#EE4F34" stroke-width="84" stroke-linejoin="round" opacity=".9" filter="url(#bWide)"/>
  <use href="#P" xlink:href="#P" fill="#E8432B" stroke="#E8432B" stroke-width="34" stroke-linejoin="round" opacity=".95" filter="url(#bMid)"/>
  <use href="#P" xlink:href="#P" fill="url(#halo)" opacity=".92" transform="translate(-5 -31) scale(1.02 1)" filter="url(#bHalo)"/>
  <use href="#P" xlink:href="#P" fill="#E8432B" stroke="#E8432B" stroke-width="10" stroke-linejoin="round" opacity=".55" filter="url(#bHalo)"/>

  <g class="lean">
    <g class="breathe">
      <!-- cuerpo con borde suave -->
      <use href="#P" xlink:href="#P" fill="url(#body)" filter="url(#bEdge)"/>

      <g clip-path="url(#clipBody)">
        <!-- borde interior más claro, como gelatina translúcida -->
        <use href="#P" xlink:href="#P" fill="none" stroke="#F9B7AA" stroke-width="34" opacity=".55" filter="url(#bRim)"/>
        <!-- brillo superior -->
        <ellipse cx="226" cy="206" rx="178" ry="66" transform="rotate(-9 226 206)" fill="url(#glossL)" filter="url(#bGloss)"/>
        <ellipse cx="250" cy="190" rx="120" ry="16" fill="#fff" opacity=".55" filter="url(#bGloss)"/>
        <!-- luz suave abajo -->
        <ellipse cx="256" cy="396" rx="112" ry="20" fill="#FFC4AE" opacity=".6" filter="url(#bRim)"/>
      </g>

      <!-- ojos -->
      <g class="look">
        <g class="eye">
          <ellipse cx="211" cy="295" rx="24" ry="34" transform="rotate(-9 211 295)" fill="url(#eyeFill)" stroke="url(#rim)" stroke-width="3.5" filter="url(#bEye)"/>
          <circle cx="205" cy="277" r="6" fill="#fff"/>
          <circle cx="217" cy="310" r="3" fill="#fff" opacity=".5"/>
        </g>
        <g class="eye">
          <ellipse cx="309" cy="290" rx="25" ry="34" transform="rotate(-9 309 290)" fill="url(#eyeFill)" stroke="url(#rim)" stroke-width="3.5" filter="url(#bEye)"/>
          <circle cx="300" cy="271" r="6" fill="#fff"/>
          <circle cx="316" cy="305" r="3" fill="#fff" opacity=".5"/>
        </g>
      </g>
    </g>
  </g>

  <!-- grano sutil, como el original -->
  <rect width="512" height="512" filter="url(#grain)" opacity=".5"/>
</svg>
