<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<defs>
  <clipPath id="frame"><rect width="1024" height="1024" rx="232"/></clipPath>
  <clipPath id="body"><path d="M 262 640 C 262 500 370 410 512 410 C 654 410 762 500 762 640 C 762 710 722 745 650 745 L 374 745 C 302 745 262 710 262 640 Z"/></clipPath>
  <linearGradient id="bodyG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#FFE6D6"/><stop offset="0.42" stop-color="#EE5A38"/><stop offset="1" stop-color="#C42F3E"/>
  </linearGradient>
  <linearGradient id="eyeG" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#FBE2D6"/>
  </linearGradient>
  <radialGradient id="vig" cx="512" cy="580" r="470" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#E84B2E" stop-opacity="0.22"/><stop offset="1" stop-color="#E84B2E" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bottomGlow" cx="512" cy="740" r="260" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F6A06A" stop-opacity="0.7"/><stop offset="1" stop-color="#F6A06A" stop-opacity="0"/>
  </radialGradient>
  <filter id="f1" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="1.6"/></filter>
  <filter id="f6" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="f12" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="12"/></filter>
  <filter id="f26" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
  <filter id="f40" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="40"/></filter>
  <filter id="grain" x="0" y="0" width="1024" height="1024" filterUnits="userSpaceOnUse">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="5" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  1.6 0 0 0 -0.62"/>
    <feComponentTransfer><feFuncA type="linear" slope="0.14"/></feComponentTransfer>
  </filter>
</defs>

<g clip-path="url(#frame)">
  <rect width="1024" height="1024" fill="#EFE3D1"/>
  <rect width="1024" height="1024" fill="url(#vig)"/>

  <g transform="translate(512 585) scale(1.3) translate(-512 -585)">
  <!-- halo difuso del cuerpo -->
  <g transform="translate(512 585) scale(1.16 1.2) translate(-512 -585)" opacity="0.8">
    <path d="M 262 640 C 262 500 370 410 512 410 C 654 410 762 500 762 640 C 762 710 722 745 650 745 L 374 745 C 302 745 262 710 262 640 Z" fill="#E84B2E" filter="url(#f40)"/>
  </g>
  <path d="M 262 640 C 262 500 370 410 512 410 C 654 410 762 500 762 640 C 762 710 722 745 650 745 L 374 745 C 302 745 262 710 262 640 Z" fill="#E84B2E" opacity="0.55" filter="url(#f26)" transform="translate(512 590) scale(1.05) translate(-512 -590)"/>

  <!-- gorro / banda detrás de la cabeza -->
  <path d="M 316 540 C 322 442 412 380 512 380 C 612 380 702 442 708 540" fill="none" stroke="#F7D683" stroke-width="80" stroke-linecap="round" opacity="0.8" filter="url(#f26)"/>
  <path d="M 316 540 C 322 442 412 380 512 380 C 612 380 702 442 708 540" fill="none" stroke="#F7D683" stroke-width="54" stroke-linecap="round" filter="url(#f6)"/>
  <path d="M 316 540 C 322 442 412 380 512 380 C 612 380 702 442 708 540" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.55" filter="url(#f6)" transform="translate(0 -14)"/>

  <!-- cuerpo -->
  <g filter="url(#f1)">
    <path d="M 262 640 C 262 500 370 410 512 410 C 654 410 762 500 762 640 C 762 710 722 745 650 745 L 374 745 C 302 745 262 710 262 640 Z" fill="url(#bodyG)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="240" y="400" width="540" height="360" fill="url(#bottomGlow)"/>
    <!-- luz interior en el borde -->
    <path d="M 262 640 C 262 500 370 410 512 410 C 654 410 762 500 762 640 C 762 710 722 745 650 745 L 374 745 C 302 745 262 710 262 640 Z" fill="none" stroke="#ffffff" stroke-width="36" opacity="0.30" filter="url(#f12)"/>
    <ellipse cx="420" cy="470" rx="120" ry="38" transform="rotate(-24 420 470)" fill="#ffffff" opacity="0.6" filter="url(#f12)"/>
  </g>

  <!-- ojos -->
  
    <g transform="rotate(6 440 588)">
      <clipPath id="eL"><ellipse cx="440" cy="588" rx="35" ry="52"/></clipPath>
      <ellipse cx="448" cy="594" rx="35" ry="52" fill="#BFD9F8" filter="url(#f6)"/>
      <ellipse cx="445" cy="592" rx="35" ry="52" fill="#BFD9F8" opacity="0.9"/>
      <g clip-path="url(#eL)">
        <ellipse cx="440" cy="588" rx="35" ry="52" fill="url(#eyeG)"/>
        <ellipse cx="416" cy="584" rx="22" ry="46" fill="none" stroke="#8E1F2E" stroke-width="16" opacity="0.38" filter="url(#f6)"/>
        <ellipse cx="433" cy="566" rx="9" ry="13" fill="#fff" opacity="0.95"/>
      </g>
    </g>
  
    <g transform="rotate(-6 590 580)">
      <clipPath id="eR"><ellipse cx="590" cy="580" rx="35" ry="52"/></clipPath>
      <ellipse cx="598" cy="586" rx="35" ry="52" fill="#BFD9F8" filter="url(#f6)"/>
      <ellipse cx="595" cy="584" rx="35" ry="52" fill="#BFD9F8" opacity="0.9"/>
      <g clip-path="url(#eR)">
        <ellipse cx="590" cy="580" rx="35" ry="52" fill="url(#eyeG)"/>
        <ellipse cx="566" cy="576" rx="22" ry="46" fill="none" stroke="#8E1F2E" stroke-width="16" opacity="0.38" filter="url(#f6)"/>
        <ellipse cx="583" cy="558" rx="9" ry="13" fill="#fff" opacity="0.95"/>
      </g>
    </g>

  </g>
  <rect width="1024" height="1024" filter="url(#grain)"/>
</g>
</svg>