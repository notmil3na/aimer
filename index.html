<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="description" content="Aimer – Plan de estudios, horarios, notas, asignaciones y colaboración de tu semestre." />
    <!-- Sin <meta name="theme-color"> a proposito. En iOS Safari ese meta hace
         que la barra inferior (y la de estado) se pinten como una BANDA OPACA
         del color indicado, que no coincide con el contenido de la app y se ve
         como una franja de color al pie que cambia con el tema. Sin el meta,
         Safari muestrea el fondo de <html> (--bg-content, igual que el area de
         contenido) y sus barras se funden con la interfaz. No volver a
         agregarlo: ya se quito una vez por este mismo motivo. -->
    <title>Aimer</title>
    <script>
      (function () {
        try {
          var THEMES = {
            rojo:      ["#E10600", "#A80000", "225,6,0", "#FFF5F4"],
            burdeos:   ["#800020", "#560016", "128,0,32", "#FFF5F4"],
            naranja:   ["#FF7A1A", "#E35E00", "255,122,26"],
            ambar:     ["#FFC94D", "#F2A900", "255,201,77"],
            verde:     ["#2BD06E", "#0FA84F", "43,208,110"],
            turquesa:  ["#00D1B2", "#00A28A", "0,209,178"],
            azul:      ["#3B82F6", "#1D4ED8", "59,130,246"],
            violeta:   ["#8B5CF6", "#6D28D9", "139,92,246"],
            rosa:      ["#FF2A6D", "#D6245C", "255,42,109"],
            gris:      ["#9AA5B8", "#5F6B82", "154,165,184"],
          };
          var s = JSON.parse(localStorage.getItem("malla_session") || "null");
          var u = (s && s.user) || (s && !s.token ? s : null);
          var r = document.documentElement;
          var mode = (u && u.appMode) || "dark";
          var c = THEMES[(u && u.appTheme)] || THEMES.ambar;
          r.setAttribute("data-theme", mode);
          r.style.setProperty("--accent", c[0]);
          r.style.setProperty("--accent2", c[1]);
          r.style.setProperty("--accent-rgb", c[2]);
          r.style.setProperty("--accent-ink", c[3] || "#14101F");
          if (u && u.fontBody && u.fontBody !== "DM Sans") r.style.setProperty("--font-body", "'" + u.fontBody + "', system-ui, sans-serif");
        } catch (e) {}
      })();
    </script>
    <script>
      try {
        if (location.search.indexOf("_sw") !== -1) {
          var u = new URL(location.href);
          u.searchParams.delete("_sw");
          history.replaceState(null, "", u.pathname + (u.search ? "?" + u.search : "") + u.hash);
        }
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" href="/fonts/Sentient-Variable.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/Sentient-VariableItalic.woff2" as="font" type="font/woff2" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet" /></noscript>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/aimer.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aimer" />
  </head>
  <body>
    
    <div class="bg" aria-hidden="true">
      <span class="bg-mesh bg-mesh--accent"></span>
      <span class="bg-mesh bg-mesh--warm1"></span>
      <span class="bg-mesh bg-mesh--warm2"></span>
      <span class="bg-grain"></span>
    </div>
    <script>
      (function () {
        try {
          var bg = document.querySelector(".bg");
          if (!bg) return;
          var sync = function () { bg.classList.toggle("bg-paused", document.hidden); };
          document.addEventListener("visibilitychange", sync);
          sync();
        } catch (e) {}
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
